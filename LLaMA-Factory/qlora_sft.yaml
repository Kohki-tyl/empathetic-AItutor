# ===== Model & Template =====
model_name_or_path: tokyotech-llm/Llama-3.1-Swallow-70B-Instruct-v0.3
template: chatml        # ChatML形式を用いることで、特殊トークンによる構造的境界を明確にします[cite: 8]。
quantization_bit: 4     # QLoRAによる4ビット量子化（NF4）でメモリ消費を抜本的に削減します[cite: 8]。

# ===== Hardware Optimization =====
bf16: true
pure_bf16: true
flash_attn: fa2

# ===== Dataset =====
dataset: math_tutor_train
eval_dataset: math_tutor_val
cutoff_len: 2048

# ===== LoRA Settings =====
stage: sft
do_train: true
finetuning_type: lora
lora_target: all        # アテンション機構や多層パーセプトロンを含む「すべての線形層（all-linear）」を対象とし、FFTに肉薄する性能を引き出します[cite: 8]。
lora_rank: 16           # ベースラインを確立するため、軽量で標準的な 16 からスタートします。
lora_alpha: 16          # 一般的なヒューリスティックに従い、アルファ（α）は r と等倍の 16 に設定します[cite: 8]。
lora_dropout: 0.05

# ===== Training Hyperparameters =====
per_device_train_batch_size: 2
gradient_accumulation_steps: 8 # 勾配累積を用いて実効バッチサイズを巨大化（4GPUで計64）させ、ベンチマークにおける汎化性能を高めます[cite: 8]。
learning_rate: 1.5e-4          # LoRAアダプターに対して十分な勾配信号を与えるため、推奨される 1e-4 から 2e-4 の間の中間値を採用します[cite: 8]。
num_train_epochs: 3.0          # プロンプトの丸暗記（過学習）を防ぐため、推奨される 1〜3 エポックの上限で学習を止めます[cite: 8]。
lr_scheduler_type: cosine      # 最適化の最終段階での滑らかな収束を保証するコサイン減衰（Cosine Decay）を適用します[cite: 8]。
warmup_ratio: 0.05             # 学習初期の急激な勾配の変化を防ぐため、全体の数パーセント（ここでは5%）のウォームアップ期間を設けます[cite: 8]。
weight_decay: 0.05

# ===== Evaluation & Logging =====
eval_strategy: steps
eval_steps: 50
logging_steps: 10
save_steps: 50
plot_loss: true
overwrite_output_dir: true

# ===== Output =====
output_dir: saves/Swallow-70B/lora/sft